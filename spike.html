<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- coi-serviceworkerでcross-origin isolationを付与しマルチスレッドWASMを有効化する。
         詳細はindex.html側の同種コメントを参照。 -->
    <script src="/coi-serviceworker.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OCR検証スパイク</title>
    <style>
      body { font-family: sans-serif; margin: 12px; }
      .result { border: 1px solid #ccc; margin: 8px 0; padding: 8px; }
      /* .ok: auto-high(手修正不要)のみ緑。.warn: needs-review/failed(要手修正)は注意色。.ng: 例外発生。 */
      .ok { background: #e6ffe6; }
      .warn { background: #fff3e0; }
      .ng { background: #ffe0e0; }
      pre { white-space: pre-wrap; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>OCR検証スパイク</h1>
    <p id="status" aria-live="polite">モデル未ロード</p>
    <input id="files" type="file" accept="image/*" multiple />
    <button id="copy">結果JSONをコピー</button>
    <div id="results"></div>
    <script type="module" src="/src/spike/main.ts"></script>
  </body>
</html>
