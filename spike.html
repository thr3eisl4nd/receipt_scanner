<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- coi-serviceworkerでcross-origin isolationを付与しマルチスレッドWASMを有効化する。
         詳細はindex.html側の同種コメントを参照。 -->
    <script src="/coi-serviceworker.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OCR検証スパイク</title>
    <!-- task-27セキュリティレビュー指摘: CSPをstyle-src 'unsafe-inline'無しで運用できるよう、
         インライン<style>ではなく外部CSSファイルを使う。 -->
    <link rel="stylesheet" href="/src/spike/spike.css" />
  </head>
  <body>
    <h1>OCR検証スパイク</h1>
    <p id="status" aria-live="polite">モデル未ロード</p>
    <input id="files" type="file" accept="image/*" multiple />
    <button id="copy">結果JSONをコピー</button>
    <div id="results"></div>
    <script type="module" src="/src/spike/main.ts"></script>
  </body>
</html>
